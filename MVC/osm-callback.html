<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion OpenStreetMap…</title>
<style>
 body{font:14px/1.6 "Segoe UI",system-ui,sans-serif;color:#1a1a18;background:#f9f8f4;
      display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
 .b{background:#fff;border:1px solid #e0ddd5;border-radius:10px;padding:26px 30px;max-width:380px}
 h1{font-size:15px;color:#1f3a1f;margin:0 0 6px}
 p{font-size:12px;color:#666;margin:0}
</style>
</head>
<body>
<div class="b">
  <h1 id="t">Connexion en cours…</h1>
  <p id="m">Cette fenêtre se fermera automatiquement.</p>
</div>
<script>
/* Reçoit le code d'autorisation OSM et le renvoie à la fenêtre principale.
   Ce fichier doit être déposé à côté de l'application et déclaré comme
   « URI de redirection » de l'application OAuth 2 enregistrée sur
   openstreetmap.org/oauth2/applications. */
(function(){
  var p = new URLSearchParams(location.search);
  var code = p.get('code'), state = p.get('state'), err = p.get('error');
  function fin(ok, msg){
    document.getElementById('t').textContent = ok ? 'Connecté ✓' : 'Échec de la connexion';
    document.getElementById('m').textContent = msg;
  }
  try{
    if(window.opener){
      window.opener.postMessage({source:'osm-oauth', code:code, state:state, error:err}, location.origin);
      fin(!err, err ? String(err) : 'Cette fenêtre se fermera automatiquement.');
      setTimeout(function(){ window.close(); }, err ? 2500 : 400);
    } else {
      fin(false, "Ouvrez la connexion depuis l'application.");
    }
  }catch(e){ fin(false, String(e && e.message || e)); }
})();
</script>
</body>
</html>
