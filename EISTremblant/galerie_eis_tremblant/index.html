<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie photo | Marche exploratoire Mont-Tremblant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#140C74; --teal:#21AEAD; --blue:#0482D3; --white:#FFFFFF;
  --teal-d:#178f8e; --teal-l:#5fd0cf; --blue-d:#0366a6; --blue-l:#6aa6e8; --indigo:#5b54c0;
  --bg:#070620; --bg2:#0b0930; --panel:#11103e; --panel2:#181a52;
  --line:#2a2870; --line2:#1d1b50;
  --ink:#eef0fb; --ink2:#c4c8ea; --muted:#8b8fc4;
  --accent:var(--teal); --accent2:var(--blue);
  --fs:1rem;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Source Sans 3',system-ui,sans-serif;background:var(--bg);color:var(--ink)}

/* ── LAYOUT ── */
.app{display:grid;height:100vh;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 360px}
.header{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;min-height:52px}
.viewer{grid-column:1;grid-row:2;position:relative;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sidebar{grid-column:2;grid-row:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.thumbstrip{grid-column:1/-1;grid-row:3;background:var(--panel2);border-top:1px solid var(--line);height:88px;display:flex;align-items:center;overflow-x:auto;gap:6px;padding:6px 12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* ── HEADER ── */
.logo-bar{display:flex;align-items:center;gap:10px}
.logo-dot{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--white)}
.header h1{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap}
.header .subtitle{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.badge-count{background:var(--teal);color:var(--bg);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px}

/* ── PHOTO VIEWER ── */
.viewer img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .25s;cursor:zoom-in}
.viewer img.loading{opacity:.3}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:none;background:rgba(11,9,48,.7);color:var(--ink);font-size:22px;cursor:pointer;border-radius:var(--radius);backdrop-filter:blur(6px);transition:background .2s}
.nav-btn:hover{background:rgba(33,174,173,.5)}
.nav-btn.prev{left:12px}
.nav-btn.next{right:12px}
.photo-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(7,6,32,.85));padding:32px 20px 14px;pointer-events:none}
.photo-label{font-size:15px;font-weight:600;color:var(--ink)}
.photo-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:14px;flex-wrap:wrap}
.photo-counter{position:absolute;top:12px;left:12px;background:rgba(11,9,48,.75);color:var(--teal-l);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;backdrop-filter:blur(6px)}

/* ── SIDEBAR ── */
.tab-bar{display:flex;border-bottom:1px solid var(--line)}
.tab-btn{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}
.tab-btn:hover{color:var(--ink)}
.tab-content{flex:1;overflow:hidden;position:relative}
.tab-pane{position:absolute;inset:0;display:none;flex-direction:column}
.tab-pane.active{display:flex}
#map{flex:1;min-height:0}
.list-pane{flex:1;overflow-y:auto;padding:8px}
.list-item{display:flex;gap:8px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s;align-items:center}
.list-item:hover,.list-item.active{background:var(--panel2)}
.list-item img{width:56px;height:42px;object-fit:cover;border-radius:6px;flex-shrink:0}
.list-item .li-label{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3}
.list-item .li-time{font-size:11px;color:var(--muted)}

/* ── CONFIG BAR ── */
.config-bar{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:6px}
.config-bar label{font-size:11px;color:var(--muted);white-space:nowrap}
.config-bar input{flex:1;font-size:11px;font-family:inherit;padding:4px 8px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:6px;outline:none}
.config-bar input:focus{border-color:var(--teal)}
.config-bar button{font-size:11px;padding:4px 10px;background:var(--teal);color:var(--bg);border:none;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}

/* ── THUMBNAIL STRIP ── */
.thumb{width:72px;height:72px;flex-shrink:0;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.6;transition:all .2s}
.thumb:hover{opacity:.85}
.thumb.active{border-color:var(--teal);opacity:1}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(7,6,32,.95);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px}
.lightbox .close-lb{position:absolute;top:14px;right:14px;width:36px;height:36px;border:none;background:rgba(255,255,255,.12);color:var(--ink);font-size:20px;border-radius:50%;cursor:pointer}

/* ── LEAFLET CUSTOM ── */
.leaflet-container{background:var(--bg2)!important;font-family:'Source Sans 3',sans-serif}
.custom-marker{width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid var(--white);box-shadow:0 1px 6px rgba(0,0,0,.4);transition:transform .15s}
.custom-marker.active{background:var(--blue);transform:scale(1.5);z-index:999!important}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:8px 10px;font-size:12px}
.leaflet-popup-content img{width:180px;height:120px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}
.leaflet-popup-content .popup-label{font-weight:600;font-size:12px}
.leaflet-popup-content .popup-time{color:var(--muted);font-size:11px}
.leaflet-control-layers{background:var(--panel)!important;border:1px solid var(--line)!important;color:var(--ink)!important;border-radius:8px!important}
.leaflet-control-layers label{color:var(--ink)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}

.attribution{font-size:10px;color:var(--muted);padding:0 10px 6px;text-align:center}

/* ── RESPONSIVE ── */
@media(max-width:800px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr 200px auto}
  .sidebar{grid-column:1;grid-row:3;border-left:none;border-top:1px solid var(--line)}
  .thumbstrip{grid-row:4;height:72px}
  .header h1{font-size:13px}
  .header .subtitle{display:none}
}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="app">
  <header class="header">
    <div class="logo-bar">
      <div class="logo-dot">SQ</div>
    </div>
    <h1>Marche exploratoire | EIS Mont-Tremblant</h1>
    <span class="badge-count" id="counter">1 / 16</span>
    <span class="subtitle">Santé Québec Laurentides · Direction de santé publique · 18 mars 2026</span>
  </header>

  <!-- ── PHOTO VIEWER ── -->
  <div class="viewer" id="viewer">
    <img id="mainPhoto" src="" alt="Photo de la marche" onclick="openLightbox()">
    <button class="nav-btn prev" onclick="navigate(-1)">&#8249;</button>
    <button class="nav-btn next" onclick="navigate(1)">&#8250;</button>
    <div class="photo-counter" id="counterBadge">1 / 16</div>
    <div class="photo-info">
      <div class="photo-label" id="photoLabel"></div>
      <div class="photo-meta" id="photoMeta"></div>
    </div>
  </div>

  <!-- ── SIDEBAR ── -->
  <div class="sidebar">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('carte')">Carte</button>
      <button class="tab-btn" onclick="switchTab('liste')">Liste</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="pane-carte">
        <div id="map"></div>
      </div>
      <div class="tab-pane" id="pane-liste">
        <div class="list-pane" id="listPane"></div>
      </div>
    </div>
    <div class="config-bar">
      <label>Dossier photos :</label>
      <input type="text" id="photoPath" value="photos/" placeholder="chemin relatif ou absolu">
      <button onclick="applyPath()">OK</button>
    </div>
    <div class="attribution">Santé Québec Laurentides · Direction de santé publique</div>
  </div>

  <!-- ── THUMBNAIL STRIP ── -->
  <div class="thumbstrip" id="thumbstrip"></div>
</div>

<!-- ── LIGHTBOX ── -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lbImg" src="" alt="Photo agrandie">
  <button class="close-lb" onclick="closeLightbox()">✕</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ═══════════════════════════════════════════
   DONNÉES PHOTOS (16 photos de démonstration)
   ═══════════════════════════════════════════ */
const PHOTOS = [
  {fn:"IMG_2522_resultat.jpg", lat:46.11569, lon:-74.57600, alt:235, dir:313, ts:"2026-03-18T09:47:49", label:"Carrefour giratoire, signalisation"},
  {fn:"IMG_2523_resultat.jpg", lat:46.11568, lon:-74.57594, alt:238, dir:295, ts:"2026-03-18T09:48:07", label:"Traverse piétonne, camion lourd"},
  {fn:"IMG_2559_resultat.jpg", lat:46.19407, lon:-74.63101, alt:233, dir:84,  ts:"2026-03-18T10:28:12", label:"Traverse en pavé uni, village"},
  {fn:"IMG_E2569_resultat.jpg",lat:46.19485, lon:-74.63060, alt:232, dir:234, ts:"2026-03-18T10:32:47", label:"Banc enneigé au village"},
  {fn:"IMG_2576_resultat.jpg", lat:46.19523, lon:-74.62339, alt:239, dir:139, ts:"2026-03-18T10:42:53", label:"Bâtiment de service dans un parc"},
  {fn:"IMG_9959_resultat.jpg", lat:46.19537, lon:-74.62252, alt:241, dir:88,  ts:"2026-03-18T10:50:19", label:"Lac gelé, début de fonte"},
  {fn:"IMG_9960_resultat.jpg", lat:46.19506, lon:-74.62624, alt:240, dir:22,  ts:"2026-03-18T10:55:59", label:"Stationnement, bornes de recharge"},
  {fn:"IMG_9961_resultat.jpg", lat:46.19504, lon:-74.62662, alt:235, dir:275, ts:"2026-03-18T10:56:53", label:"Sentier enneigé, Marché Bonichoix"},
  {fn:"IMG_2639_resultat.jpg", lat:46.20211, lon:-74.56938, alt:346, dir:61,  ts:"2026-03-18T11:58:16", label:"Clôture de chantier, vue montagne"},
  {fn:"IMG_2640_resultat.jpg", lat:46.20110, lon:-74.56926, alt:342, dir:2,   ts:"2026-03-18T12:00:46", label:"Navette gratuite Casino"},
  {fn:"IMG_0001_resultat.jpg", lat:46.12151, lon:-74.59229, alt:216, dir:271, ts:"2026-03-18T15:16:22", label:"Cour d'école et autobus scolaires"},
  {fn:"IMG_2675_resultat.jpg", lat:46.12013, lon:-74.59314, alt:213, dir:266, ts:"2026-03-18T15:32:34", label:"Aire de jeux, glissade et escalade"},
  {fn:"IMG_2685_resultat.jpg", lat:46.11862, lon:-74.59314, alt:214, dir:125, ts:"2026-03-18T15:41:09", label:"Intersection routes 117/327"},
  {fn:"IMG_2686_resultat.jpg", lat:46.11861, lon:-74.59306, alt:215, dir:181, ts:"2026-03-18T15:42:30", label:"Trottoir pavé uni, routes 117/327"},
  {fn:"IMG_2725_resultat.jpg", lat:46.12664, lon:-74.58123, alt:232, dir:187, ts:"2026-03-18T16:37:26", label:"Rue sans trottoir, zone industrielle"},
  {fn:"IMG_2726_resultat.jpg", lat:46.12603, lon:-74.58138, alt:231, dir:69,  ts:"2026-03-18T16:38:36", label:"Parc du Centenaire, entrée"}
];

/* ═══════════════════════════════════════════
   ÉTAT
   ═══════════════════════════════════════════ */
let current = 0;
let basePath = 'photos/';
let map, markers = [], pathLine;

/* ═══════════════════════════════════════════
   INITIALISATION
   ═══════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  buildThumbs();
  buildList();
  showPhoto(0);
  document.addEventListener('keydown', onKey);
});

/* ── CARTE ── */
function initMap() {
  map = L.map('map', {zoomControl: true, attributionControl: false}).setView([46.16, -74.60], 12);

  const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution:'© Esri', maxZoom:19
  });
  const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution:'© Esri', maxZoom:19
  });
  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution:'© Esri', maxZoom:19
  });

  esriStreet.addTo(map);
  L.control.layers({'Rue':esriStreet,'Topographie':esriTopo,'Satellite':esriSat}, null, {position:'topright'}).addTo(map);

  // Marqueurs
  const bounds = [];
  PHOTOS.forEach((p, i) => {
    const icon = L.divIcon({className:'', html:`<div class="custom-marker" data-idx="${i}"></div>`, iconSize:[14,14], iconAnchor:[7,7]});
    const m = L.marker([p.lat, p.lon], {icon}).addTo(map);
    m.on('click', () => showPhoto(i));
    m.bindPopup(`<img src="${basePath}${p.fn}" onerror="this.style.display='none'" alt=""><div class="popup-label">${p.label}</div><div class="popup-time">${fmtTime(p.ts)}</div>`, {maxWidth:200});
    markers.push(m);
    bounds.push([p.lat, p.lon]);
  });

  // Tracé du parcours
  pathLine = L.polyline(bounds, {color:'#21AEAD', weight:2, opacity:.5, dashArray:'6 4'}).addTo(map);
  map.fitBounds(bounds, {padding:[20,20]});
}

/* ── VIGNETTES ── */
function buildThumbs() {
  const strip = document.getElementById('thumbstrip');
  PHOTOS.forEach((p, i) => {
    const img = document.createElement('img');
    img.className = 'thumb' + (i === 0 ? ' active' : '');
    img.src = basePath + p.fn;
    img.alt = p.label;
    img.loading = 'lazy';
    img.dataset.idx = i;
    img.onclick = () => showPhoto(i);
    img.onerror = function(){ this.style.background='var(--panel2)'; };
    strip.appendChild(img);
  });
}

/* ── LISTE ── */
function buildList() {
  const pane = document.getElementById('listPane');
  pane.innerHTML = '';
  PHOTOS.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'list-item' + (i === current ? ' active' : '');
    div.dataset.idx = i;
    div.onclick = () => showPhoto(i);
    div.innerHTML = `<img src="${basePath}${p.fn}" alt="" loading="lazy" onerror="this.style.background='var(--panel2)'"><div><div class="li-label">${p.label}</div><div class="li-time">${fmtTime(p.ts)} · ${Math.round(p.alt)} m</div></div>`;
    pane.appendChild(div);
  });
}

/* ═══════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════ */
function showPhoto(idx) {
  if (idx < 0) idx = PHOTOS.length - 1;
  if (idx >= PHOTOS.length) idx = 0;
  current = idx;
  const p = PHOTOS[idx];

  // Photo principale
  const img = document.getElementById('mainPhoto');
  img.classList.add('loading');
  img.onload = () => img.classList.remove('loading');
  img.onerror = () => { img.classList.remove('loading'); };
  img.src = basePath + p.fn;

  // Info
  document.getElementById('photoLabel').textContent = p.label;
  document.getElementById('photoMeta').innerHTML =
    `<span>${fmtTime(p.ts)}</span><span>${Math.round(p.alt)} m d'altitude</span><span>${Math.round(p.dir)}° direction</span><span>${p.fn.replace('_resultat.jpg','')}</span>`;

  // Compteur
  const txt = `${idx + 1} / ${PHOTOS.length}`;
  document.getElementById('counter').textContent = txt;
  document.getElementById('counterBadge').textContent = txt;

  // Vignettes
  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
    if (i === idx) t.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  });

  // Liste
  document.querySelectorAll('.list-item').forEach((li, i) => li.classList.toggle('active', i === idx));

  // Carte
  updateMapMarker(idx);
}

function navigate(dir) {
  showPhoto(current + dir);
}

function onKey(e) {
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'f' || e.key === 'Enter') openLightbox();
}

function updateMapMarker(idx) {
  document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('active'));
  const active = document.querySelector(`.custom-marker[data-idx="${idx}"]`);
  if (active) active.classList.add('active');
  const p = PHOTOS[idx];
  map.flyTo([p.lat, p.lon], 15, {duration: .6});
}

/* ── LIGHTBOX ── */
function openLightbox() {
  const lb = document.getElementById('lightbox');
  document.getElementById('lbImg').src = basePath + PHOTOS[current].fn;
  lb.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* ── TABS ── */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(name)));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  if (name === 'carte') setTimeout(() => map.invalidateSize(), 100);
}

/* ── CONFIG ── */
function applyPath() {
  let val = document.getElementById('photoPath').value.trim();
  if (val && !val.endsWith('/') && !val.endsWith('\\')) val += '/';
  basePath = val;

  // Reconstruire les vignettes, la liste, les popups
  document.getElementById('thumbstrip').innerHTML = '';
  buildThumbs();
  buildList();
  showPhoto(current);

  // Reconstruire popups
  markers.forEach((m, i) => {
    const p = PHOTOS[i];
    m.setPopupContent(`<img src="${basePath}${p.fn}" onerror="this.style.display='none'" alt=""><div class="popup-label">${p.label}</div><div class="popup-time">${fmtTime(p.ts)}</div>`);
  });
}

/* ── UTILITAIRES ── */
function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('fr-CA', {hour:'2-digit', minute:'2-digit'});
}
</script>
</body>
</html>
