meta:
  titre_digest: "Veille — Environnements alimentaires"
  contexte_chercheur: >
    une chercheuse en santé publique travaillant sur les environnements
    alimentaires, les systèmes alimentaires territoriaux (SAT), la sécurité/
    insécurité alimentaire et les politiques publiques en alimentation durable

# Mots-clés de veille — organisés par thème
# Une requête par ligne. Ajoute/retire librement.

scientifique:
  # Requêtes envoyées à PubMed et Semantic Scholar
  - "food environment AND public health"
  - "food desert OR food swamp"
  - "food insecurity determinants"
  - "access to healthy food"
  - "food supply AND food availability"
  - "dietary behaviours food environment"
  - "food distribution systems"
  - "agroecological transition"
  - "territorial food systems"
  - "food governance"
  - "food self-sufficiency OR food autonomy"
  - "short food supply chains"
  - "local food networks"
  - "urban food planning"
  - "food system resilience"
  - "sustainable healthy diets"
  - "food policy AND public health nutrition"
  - "social inequalities in health nutrition"
  - "climate adaptation food systems"
  - "One Health food systems"

medias:
  # Mots-clés cherchés dans les flux RSS et Google News
  - "environnement alimentaire"
  - "désert alimentaire"
  - "insécurité alimentaire"
  - "accessibilité alimentaire"
  - "offre alimentaire"
  - "habitudes alimentaires"
  - "transition agroécologique"
  - "système alimentaire territorial"
  - "projet alimentaire territorial"
  - "autonomie alimentaire"
  - "circuits courts"
  - "planification alimentaire urbaine"
  - "résilience alimentaire"
  - "alimentation durable"
  - "politique alimentaire"
  - "sécurité alimentaire"
  - "banque alimentaire"

# Nombre max de résultats à considérer par source, par exécution
limites:
  pubmed_max_results: 15
  semantic_scholar_max_results: 15
  rss_max_par_flux: 10

# Fenêtre temporelle pour la littérature scientifique (jours)
fenetre_jours_scientifique: 8
